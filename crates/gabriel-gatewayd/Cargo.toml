[package]
name = "gabriel-gatewayd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gabriel background gateway/mesh-routing service (runs as a Windows Service in production)"

[[bin]]
name = "gabriel-gatewayd"
path = "src/main.rs"

[dependencies]
gabriel-core = { path = "../gabriel-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
