[workspace]
exclude = ["ui/gabriel-desktop/src-tauri"]
resolver = "2"
members = [
    "crates/gabriel-core",
    "crates/gabriel-gatewayd",
    "crates/gabriel-client",
    "crates/gabriel-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
